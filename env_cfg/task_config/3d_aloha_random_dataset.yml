# 3D ALOHA dataset with RoboTwin's official domain-randomization settings.
# Configuration reference:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
eval_instruction: seen
domain_randomization:
  random_background: true
  cluttered_table: true
  clean_background_rate: 0.02
  random_head_camera_dis: 0
  random_table_height: 0.03
  random_light: true
  crazy_random_light_rate: 0.02
  # Experimental and not fully supported by RoboTwin.
  random_embodiment: false
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
  # Only these cameras are persisted in the dataset. Other scene cameras may
  # still exist for rendering/evaluation, but are excluded from observations.
  data_camera_names:
    - head_camera
    - left_camera
    - right_camera
    - front_camera
data_type:
  rgb: true
  third_view: true
  depth: true
  pointcloud: false
  observer: true
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
