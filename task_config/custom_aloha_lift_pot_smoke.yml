# Temporary smoke-test config for lift_pot with ALOHA.
render_freq: 0
episode_num: 5
use_seed: false
save_freq: 10
embodiment: [aloha-agilex]
language_num: 1
domain_randomization:
  random_background: true
  cluttered_table: true
  clean_background_rate: 0.2
  random_head_camera_dis: 0.2
  random_table_height: 0.1
  random_light: true
  crazy_random_light_rate: 0.1
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: true
  depth: true
  pointcloud: false
  observer: true
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: /tmp/robotwin_lift_pot_raw
clear_cache_freq: 1
collect_data: true
collect_failed_data: true
max_failed_episode_rate: 0.2
failed_episode_max_frames: 100
eval_video_log: false
